name: Go tests

on: [ push, pull_request ]

jobs:
  go-test:

    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version:
          # <block keep-sorted="asc" keep-unique>
          - '1.23'
          - '1.24'
          - '1.25'
          - '1.26'
          # </block>

    steps:
      - uses: actions/checkout@v4
      - name: Setup Go ${{ matrix.go-version }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: Run tests
        run: go test -v ./...